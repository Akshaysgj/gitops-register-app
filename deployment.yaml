apiVersion: apps/v1
kind: Deployment
metadata:
  name: register-app-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: register-app-pipeline
  template:
    metadata:
      labels:
        app: register-app-pipeline
    spec:
      containers:
        - name: register-app-pipeline
          image: akuhub/register-app:1.0.0-29
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - containerPort: 8080
